<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#f3c928">
<title>Mr. & Mrs. Ruggiero Wedding</title>
<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
html, body {
  margin: 0;
  min-height: 100%;
  font-family: Arial, Helvetica, sans-serif;
  background: #f3c928;
}
body {
  display: flex;
  justify-content: center;
  color: #211b12;
}
.camera {
  width: 100%;
  max-width: 520px;
  min-height: 100vh;
  padding: 20px;
  position: relative;
  overflow: hidden;
  background:
    radial-gradient(circle at top left, #ffe96d 0%, transparent 35%),
    linear-gradient(135deg, #f6d02f, #e6ad18);
  border: 8px solid #fff0a6;
}
.top {
  text-align: center;
  margin-top: 20px;
}
.camera-icon {
  font-size: 38px;
}
.title {
  font-size: 36px;
  font-weight: 900;
  line-height: 1.05;
  text-transform: uppercase;
}
.subtitle {
  font-size: 17px;
  font-weight: bold;
  margin-top: 10px;
}
.viewfinder {
  width: 100%;
  margin-top: 28px;
  aspect-ratio: 3 / 4;
  background: #111;
  border: 10px solid #222;
  border-radius: 8px;
  overflow: hidden;
}
video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.status {
  text-align: center;
  margin-top: 18px;
}
.counter {
  display: inline-block;
  background: #111;
  color: white;
  padding: 10px 22px;
  border-radius: 6px;
  font-size: 24px;
  font-weight: bold;
}
.message {
  text-align: center;
  font-size: 18px;
  font-weight: bold;
  margin: 18px 10px;
}
.controls {
  display: flex;
  justify-content: center;
  margin-top: 15px;
}
.shutter {
  width: 95px;
  height: 95px;
  border-radius: 50%;
  border: 8px solid white;
  background: #d32f2f;
  box-shadow: 0 0 0 5px #222;
  cursor: pointer;
}
.shutter:active {
  transform: scale(.93);
}
.shutter:disabled {
  background: #777;
}
.gallery {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 6px;
  margin-top: 25px;
}
.gallery img {
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;
  border: 3px solid white;
}
.film-label {
  margin: 25px auto 10px;
  background: #fff4b0;
  border: 3px dashed #222;
  padding: 12px;
  text-align: center;
  font-weight: bold;
}
#canvas {
  display: none;
}
</style>
</head>
<body>
<div class="camera">
  <div class="top">
    <div class="camera-icon">📷</div>
<div class="title">
  Mr. & Mrs.<br>
  Ruggiero Wedding
</div>
<div class="subtitle">
  WEDDING DISPOSABLE CAMERA
</div>
  </div>
  <div class="viewfinder" id="viewfinder">
    <video id="video" autoplay playsinline muted></video>
  </div>
  <div class="status">
    <div class="counter">
      <span id="photoCount">0</span> / 10
    </div>
  </div>
  <div class="message" id="message">
    Capture your favorite wedding memories!
  </div>
  <div class="controls">
    <button class="shutter" id="captureButton" disabled></button>
  </div>
  <div class="gallery" id="gallery"></div>
  <div class="film-label">
    Mr. & Mrs. Ruggiero Wedding<br>
    Thanks for celebrating with us!
  </div>
</div>
<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const captureButton = document.getElementById("captureButton");
const photoCount = document.getElementById("photoCount");
const gallery = document.getElementById("gallery");
const message = document.getElementById("message");
const MAX_PHOTOS = 10;
// Google Drive URL goes here after setup.
const GOOGLE_SCRIPT_URL =
"PASTE_YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE";
let guestId = localStorage.getItem("ruggieroWeddingGuestId");
if (!guestId) {
  guestId = crypto.randomUUID();
  localStorage.setItem("ruggieroWeddingGuestId", guestId);
}
const countKey = "ruggieroWeddingPhotoCount-" + guestId;
let count = Number(localStorage.getItem(countKey)) || 0;
photoCount.textContent = count;
function updateLimit() {
  if (count >= MAX_PHOTOS) {
    captureButton.disabled = true;
    message.textContent =
      "All 10 photos taken. Thank you! ❤️";
  }
}
updateLimit();
async function startCamera() {
  try {
    const stream =
      await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { ideal: "environment" }
        },
        audio: false
      });
    video.srcObject = stream;
    await video.play();
    captureButton.disabled = count >= MAX_PHOTOS;
    message.textContent =
      "You're ready! Take up to 10 wedding photos.";
  }
  catch (error) {
    console.error(error);
    message.textContent =
      "Please allow camera access and reload.";
  }
}
document.getElementById("viewfinder")
  .addEventListener("click", startCamera, { once: true });
captureButton.addEventListener("click", async () => {
  if (count >= MAX_PHOTOS) return;
  if (!video.videoWidth) {
    message.textContent =
      "Tap the camera preview to start.";
    return;
  }
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  const context = canvas.getContext("2d");
  context.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );
  const imageData =
    canvas.toDataURL("image/jpeg", 0.88);
  const image = document.createElement("img");
  image.src = imageData;
  gallery.appendChild(image);
  count++;
  localStorage.setItem(countKey, count);
  photoCount.textContent = count;
  if (GOOGLE_SCRIPT_URL.startsWith(
    "https://script.google.com/"
  )) {
    fetch(GOOGLE_SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify({
        guestId: guestId,
        photoNumber: count,
        filename:
          "Ruggiero-Wedding-" +
          guestId + "-" + count + ".jpg",
        image: imageData
      })
    });
  } else {
    message.textContent =
      "Photo captured! Google Drive is not connected yet.";
  }
  updateLimit();
});
</script>
</body>
</html>
